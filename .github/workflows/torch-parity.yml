name: ZERO Torch parity
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy==2.2.6 tokenizers==0.22.0
      - run: python -m unittest discover -s tests -p test_zero_torch.py
      - run: python -m unittest discover -s tests -p test_subword.py
      - run: python -m unittest discover -s tests -p test_subword_release.py
      - run: python -m unittest discover -s tests -p test_replication.py
      - run: python -m unittest discover -s tests -p test_diagnostic_controls.py
